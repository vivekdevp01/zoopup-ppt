<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ZoopUp Omaxe game zone: live 3D model with people playing, and a VR walkthrough for headsets.">
<meta name="theme-color" content="#0b0908">
<link rel="icon" type="image/png" href="assets/img/zoopup-logo.png?v=480beba303">
<link rel="preload" href="data/scene.json?v=4c6a092884" as="fetch" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css?v=480beba303">
<title>ZoopUp Omaxe Render</title>
<style>
/* Layout: full-bleed WebGL stage. Brand top-left, control panel (Lighting + People) top-right, info card bottom-left, view chips along the bottom. One dark look: a venue at night. */
:root {
  --bg: #0b0908;
  --panel: rgba(18, 13, 11, .86);
  --line: rgba(227, 179, 65, .28);
  --gold: #e3b341;
  --ink: #f3e6d0;
  --muted: #b5a596;
  --cyan: #45cbe0;
  --display: 'Cinzel', Georgia, 'Times New Roman', serif;
  --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; background: var(--bg); }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
[hidden] { display: none !important; }
.hud { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.brand { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); padding: 10px 14px; max-width: min(430px, calc(100vw - 28px)); display: flex; gap: 12px; align-items: center; }
.brand img { height: 34px; width: auto; flex: none; }
.brand h1 { font: 700 15px/1.15 var(--display); letter-spacing: .06em; margin: 0; color: var(--gold); }
.brand p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.vrbtn { margin-top: 8px; font: 600 12.5px/1 var(--body); color: #1d1600; background: var(--gold); border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; pointer-events: auto; }
.vrbtn:disabled { background: rgba(255,255,255,0.14); color: var(--muted); cursor: default; }
.vrbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.brand p.vrnote { display: block; max-width: 300px; }
.vrbtn[hidden], .brand p.vrnote[hidden], .vrq[hidden] { display: none !important; }
.vrq { display: flex; align-items: center; gap: 4px; margin-top: 6px; pointer-events: auto; font: 500 11px/1 var(--body); color: var(--muted); }
.vrq span { margin-right: 2px; }
.vrq button { font: 600 11px/1 var(--body); color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; cursor: pointer; }
.vrq button[aria-pressed="true"] { background: var(--gold); color: #1d1600; border-color: var(--gold); }
.vrq button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ctl { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: 286px; max-height: calc(100% - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto; padding: 4px 12px 10px; scrollbar-width: thin; }
.ctl details { border-bottom: 1px solid var(--line); padding: 8px 0; }
.ctl details:last-child { border-bottom: 0; }
.ctl summary { cursor: pointer; list-style: none; font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
.ctl summary::-webkit-details-marker { display: none; }
.ctl summary::after { content: "–"; color: var(--muted); }
.ctl details:not([open]) summary::after { content: "+"; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 9px 0 6px; }
.seg button, .tg, .btn { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink); font: 500 11.5px var(--body); padding: 7px 4px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1a0f08; border-color: var(--gold); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; padding: 3px 0; }
.row input[type=range] { width: 128px; accent-color: var(--gold); }
.row output { min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); font-size: 11.5px; }
.tgs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
.tg { display: flex; gap: 6px; align-items: center; justify-content: flex-start; padding: 7px 8px; }
.tg i { width: 8px; height: 8px; border-radius: 2px; border: 1px solid var(--muted); flex: none; }
.tg[aria-pressed="true"] { border-color: var(--gold); background: rgba(227,179,65,.12); }
.tg[aria-pressed="true"] i { background: var(--gold); border-color: var(--gold); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
.btn { padding: 8px 6px; }
.btn.wide { grid-column: 1 / -1; }
.btn[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: #06181c; }
.note { font-size: 11px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.info { left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); width: min(330px, calc(100vw - 28px)); padding: 12px 15px; }
.info .eyebrow { font: 600 10px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); }
.info h2 { font: 700 18px/1.15 var(--display); letter-spacing: .04em; margin: 4px 0 2px; }
.info .size { font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums; }
.info ul { margin: 7px 0 0; padding: 0 0 0 16px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.views { left: 0; right: 0; bottom: 0; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
.chip { appearance: none; flex: none; border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--ink); font: 500 12.5px var(--body); padding: 9px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--gold)); }
.chip[aria-current="true"] { background: var(--gold); color: #1a0f08; border-color: var(--gold); }
.chip[aria-current="true"] i { background: #1a0f08; }
.toast { position: fixed; z-index: 6; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--cyan); color: var(--ink); font-size: 12.5px; padding: 8px 14px; border-radius: 999px; }
#loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg); transition: opacity .6s; }
#loader.done { opacity: 0; pointer-events: none; }
#loader .box { text-align: center; padding: 0 24px; }
#loader .lg { height: 64px; width: auto; display: block; margin: 0 auto; }
#loader .s { margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#loader .bar { margin: 14px auto 0; width: 240px; height: 3px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
#loader .bar b { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
#err { margin-top: 12px; font-size: 12px; color: #ff9a8a; max-width: 420px; }
@media (max-width: 720px) {
  .brand p { display: none; }
  .brand h1 { font-size: 13px; }
  .brand img { height: 26px; }
  .ctl { top: calc(60px + env(safe-area-inset-top, 0px)); width: min(286px, calc(100vw - 28px)); max-height: calc(100% - 190px); }
  .info { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 9px 12px; }
  .info ul { display: none; }
  .info h2 { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { #loader { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>

<header class="hud brand">
  <img src="assets/img/zoopup-logo.png?v=480beba303" alt="ZoopUp">
  <div>
    <h1>Omaxe &middot; 3D Render</h1>
    <p>Your SketchUp model omaxe_3d.skp with real materials, lights and shadows.</p>
    <button id="vrBtn" class="vrbtn" type="button" hidden disabled>Checking VR…</button>
    <div id="vrQ" class="vrq" role="group" aria-label="VR quality" hidden><span>VR quality</span><button type="button" data-q="smooth">Smooth</button><button type="button" data-q="hd">HD</button><button type="button" data-q="ultra">Ultra HD</button></div>
    <p id="vrNote" class="vrnote" hidden></p>
  </div>
</header>

<aside class="hud ctl" id="ctl" aria-label="Render controls">
  <details id="pLight" open>
    <summary>Lighting</summary>
    <div class="seg" role="group" aria-label="Lighting mood">
      <button data-mode="day" aria-pressed="false">Mall day</button>
      <button data-mode="evening" aria-pressed="true">Evening</button>
      <button data-mode="night" aria-pressed="false">Night neon</button>
    </div>
    <div class="row"><label for="rExp">Brightness</label><input type="range" id="rExp" min="0.4" max="2" step="0.02" value="1"></div>
    <div class="row"><label for="rCeil">Ceiling lights</label><input type="range" id="rCeil" min="0" max="2" step="0.05" value="1"></div>
    <div class="row"><label for="rGlow">Neon &amp; screens</label><input type="range" id="rGlow" min="0" max="2.5" step="0.05" value="1"></div>
    <div class="row"><label for="rWarm">Light colour</label><input type="range" id="rWarm" min="0" max="1" step="0.02" value="0.45" aria-describedby="warmHint"></div>
    <p class="note" id="warmHint">Left is cool white, right is warm white.</p>
    <div class="tgs">
      <button class="tg" id="tCeiling" aria-pressed="true"><i></i>Ceiling</button>
      <button class="tg" id="tShadow" aria-pressed="true"><i></i>Shadows</button>
      <button class="tg" id="tAO" aria-pressed="true"><i></i>Soft shade</button>
      <button class="tg" id="tBloom" aria-pressed="true"><i></i>Glow</button>
      <button class="tg" id="tHQ" aria-pressed="true"><i></i>High quality</button>
      <button class="tg" id="tTour" aria-pressed="false"><i></i>Auto tour</button>
    </div>
  </details>
  <details id="pPeople" open>
    <summary>People</summary>
    <div class="tgs">
      <button class="tg" id="tPeople" aria-pressed="true"><i></i>Show people</button>
      <button class="tg" id="tWalk" aria-pressed="true"><i></i>Walking</button>
      <button class="tg" id="tRide" aria-pressed="true"><i></i>Bumper cars driving</button>
      <button class="tg" id="tRiders" aria-pressed="true"><i></i>Riders in cars</button>
      <button class="tg" id="tEsc" aria-pressed="true"><i></i>Escalators running</button>
      <button class="tg" id="tStaff" aria-pressed="true"><i></i>Cashier &amp; guard</button>
      <button class="tg" id="tBowl" aria-pressed="true"><i></i>Bowling game</button>
      <button class="tg" id="tParty" aria-pressed="true"><i></i>Birthday party</button>
      <button class="tg" id="tTruck" aria-pressed="true"><i></i>Truck ride riders</button>
      <button class="tg" id="tCounter" aria-pressed="true"><i></i>Counter customers</button>
      <button class="tg" id="tLaser" aria-pressed="true"><i></i>Laser tag game</button>
      <button class="tg" id="tArcade" aria-pressed="true"><i></i>Arcade players</button>
    </div>
    <div class="row"><label for="rFam">Families</label><input type="range" id="rFam" min="0" max="16" step="1" value="6"><output id="oFam" for="rFam">6</output></div>
    <div class="row"><label for="rKids">Extra kids playing</label><input type="range" id="rKids" min="0" max="16" step="1" value="5"><output id="oKids" for="rKids">5</output></div>
    <div class="row"><label for="rPlay">Kids in soft play</label><input type="range" id="rPlay" min="0" max="14" step="1" value="8"><output id="oPlay" for="rPlay">8</output></div>
    <div class="row"><label for="rEsc">On escalators</label><input type="range" id="rEsc" min="0" max="16" step="1" value="10"><output id="oEsc" for="rEsc">10</output></div>
    <div class="row"><label for="rSize">Size</label><input type="range" id="rSize" min="0.85" max="1.15" step="0.01" value="1"><output id="oSize" for="rSize">100%</output></div>
    <div class="btns">
      <button class="btn" id="bAdd">+ Add family</button>
      <button class="btn" id="bRemove">&minus; Remove family</button>
      <button class="btn wide" id="bPlace" aria-pressed="false">Tap the floor to place a family</button>
      <button class="btn wide" id="bShuffle">Shuffle places</button>
    </div>
    <p class="note" id="peopleNote">Loading people&hellip;</p>
  </details>
</aside>

<aside class="hud info" aria-live="polite">
  <div class="eyebrow" id="zEy">Overview</div>
  <h2 id="zT">Whole game zone</h2>
  <div class="size" id="zS"></div>
  <ul id="zL"></ul>
</aside>

<nav class="hud views" id="views" aria-label="Camera views"></nav>
<div class="toast" id="toast" hidden></div>

<div id="loader"><div class="box"><img class="lg" src="assets/img/zoopup-logo.png?v=480beba303" alt="ZoopUp"><div class="s" id="ldS">Opening your SketchUp model&hellip;</div><div class="bar"><b id="ldB"></b></div><div id="err" hidden></div></div></div>
<script type="module" src="assets/js/app.js?v=480beba303"></script>
</body>
</html>
